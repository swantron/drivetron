name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Catches a broken static export on pull requests too, not only at deploy time
      - run: npm run build

      # Security rules are the only backend and this workflow deploys them, so
      # they're tested against the emulator before anything ships.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm install -g firebase-tools@15
      - run: npm run test:rules

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Firebase web config is public by design (rules do the access control), so plain vars, not secrets.
      - run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: mt-services-swantron
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}

      # Keyless, same as the mt repo: GitHub's OIDC token is exchanged for short-lived
      # credentials. The pool's provider must also trust this repo (by numeric id) on main.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/622256087543/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-action-deploy@mt-services-swantron.iam.gserviceaccount.com

      - run: npm install -g firebase-tools@15

      - run: firebase deploy --only hosting:drive-mt-services,firestore:rules --project mt-services-swantron --non-interactive
